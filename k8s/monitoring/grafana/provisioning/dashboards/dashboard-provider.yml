apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provider
  namespace: goflow
data:
  dashboard-provider.yaml: |
    apiVersion: 1

    providers:
      - name: GoFlow
        orgId: 1
        folder: GoFlow
        type: file
        disableDeletion: true
        editable: false
        updateIntervalSeconds: 30
        allowUiUpdates: false
        options:
          path: /var/lib/grafana/dashboards