apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: goflow
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s

    scrape_configs:
      - job_name: "goflow"

        metrics_path: /metrics

        kubernetes_sd_configs:
          - role: pod
            namespaces:
              names:
                - goflow

        relabel_configs:
          - source_labels:
              - __meta_kubernetes_pod_label_app
            regex: goflow
            action: keep

          - source_labels:
              - __meta_kubernetes_namespace
            regex: goflow
            action: keep

          - source_labels:
              - __meta_kubernetes_pod_ip
            target_label: __address__
            replacement: $1:8080

          - source_labels:
              - __meta_kubernetes_pod_name
            target_label: pod