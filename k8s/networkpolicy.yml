apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: goflow-network-policy
  namespace: goflow

spec:
  podSelector:
    matchLabels:
      app: goflow

  policyTypes:
    - Ingress
    - Egress

  ingress:

    # Allow Prometheus to scrape GoFlow metrics
    - from:
        - podSelector:
            matchLabels:
              app: prometheus
      ports:
        - protocol: TCP
          port: 8080

  egress:

    # Allow DNS resolution
    - ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53

    # PostgreSQL
    - ports:
        - protocol: TCP
          port: 5432