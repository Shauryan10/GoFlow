apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: goflow
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/Shauryan10/GoFlow.git
    targetRevision: 52c0946e86c33e8dd9b62a46125c6d4496f575a5
    path: k8s

  destination:
    server: https://kubernetes.default.svc
    namespace: goflow

  syncPolicy:
    automated:
      prune: true
      selfHeal: true